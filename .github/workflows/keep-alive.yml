name: Keep Render backend awake

# Render's free plan spins the service down after ~15 minutes without traffic.
# This pings the health endpoint every 10 minutes so it stays up.
# GitHub may delay scheduled runs, and disables them after 60 days without
# repository activity; re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ secrets.BACKUP_API_URL }}
        run: |
          set -eu
          test -n "$BACKEND_URL"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 20 --max-time 90 \
            "${BACKEND_URL%/}/health"
